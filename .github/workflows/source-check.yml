name: Public source check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout diagnostic
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate built-in Node runtime
        run: node -e "if (Number(process.versions.node.split('.')[0]) < 22) process.exit(1)"
      - name: Check advertised public source endpoints
        env:
          SOURCE_ORIGIN: ${{ secrets.SOURCE_ORIGIN }}
        run: node source-probe.mjs
